name: Build Android APK

# בונה את אפליקציית ההתראות לצוות (android-app) ישירות בגיטהאב - אין צורך באנדרואיד סטודיו
# מקומי בשביל זה. רץ אוטומטית בכל push שמשנה משהו בתוך android-app/, וגם ידנית מהטאב
# "Actions" בגיטהאב (כפתור "Run workflow").
on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      # מעלה את קובץ ה-APK כ"Artifact" של הריצה הזו - נגיש תמיד מטאב Actions, גם בלי release.
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ogen-play-staff-notify-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      # יוצר/מעדכן Release קבוע בשם "android-latest" עם קישור הורדה ישיר ל-APK, כדי שלא
      # תצטרך לחפש בכל פעם בתוך ריצות ה-Actions - זה תמיד אותו קישור, מתעדכן אוטומטית.
      - name: Publish to "android-latest" release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: "עוגן פליי - התראות צוות (APK אחרון)"
          body: "נבנה אוטומטית מ-commit ${{ github.sha }}. יש להוריד את app-debug.apk ולהתקין (יש לאשר \"התקנה ממקורות לא ידועים\")."
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
