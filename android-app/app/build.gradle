plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ogenplay.staffnotify'
    compileSdk 34

    defaultConfig {
        applicationId "com.ogenplay.staffnotify"
        // דרישה מפורשת: תמיכה באנדרואיד 4.4 (KitKat, API 19) ומעלה. בגלל זה כל ספריות
        // ה-AndroidX/OkHttp למטה נעולות בכוונה לגרסאות ישנות יותר שעדיין תומכות ב-API 19 -
        // גרסאות חדשות יותר (למשל Material Components, OkHttp 4.x) דרשו לפחות API 21
        // ומעלה ולא היו מתקמפלות בכלל מול minSdk 19.
        minSdk 19
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // כל הגרסאות כאן נבחרו בכוונה כ"אחרונה שעדיין תומכת ב-API 19" - לא הגרסה הכי חדשה.
    implementation 'androidx.core:core-ktx:1.6.0'
    implementation 'androidx.appcompat:appcompat:1.4.2'
    implementation 'androidx.activity:activity-ktx:1.2.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.3.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
    // OkHttp 4.x דורש minSdk 21 ומעלה (מודול Kotlin) - 3.12.x היא הגרסה האחרונה הרשמית
    // שגוגל/Square עדיין תומכת בה עבור אנדרואיד ישן יותר (עד API 15).
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    // Conscrypt - ספריית TLS עדכנית שגוגל ממליצה להתקין כ-Security Provider על מכשירים ישנים
    // (כמו אנדרואיד 4.4). בלי זה, מכשירים ישנים נכשלים בהתחברות לשרתים מודרניים (כמו
    // Supabase/Vercel) עם שגיאת "SSL handshake aborted... sslv3 alert handshake failure",
    // כי ספריית ה-SSL המובנית שלהם לא תומכת בפרוטוקולי/צפני-הצפנה שהשרתים דורשים היום.
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
}
