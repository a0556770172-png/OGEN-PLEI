# תיעוד בלבד - ההעתק החי: /etc/nginx/conf.d/02-ogen-perf.conf
# עוגן פליי - ביצועים. מטמון תגובות, חיבורים חיים לאפליקציה, והעברת הדחיסה מ-Node ל-nginx.
proxy_cache_path /var/cache/nginx/ogen levels=1:2 keys_zone=ogen:64m max_size=1g inactive=7d use_temp_path=off;
proxy_cache_path /var/cache/nginx/ogen-html levels=1:2 keys_zone=ogen_html:16m max_size=128m inactive=1h use_temp_path=off;

# ה-RSC של Next (ניווט פנימי) נדחס גם הוא
gzip_types text/x-component;

# חיבורים חיים (keepalive) בין nginx ל-Node - בלי חיבור TCP חדש לכל בקשה
map $http_upgrade $ogen_conn_upgrade { default upgrade; '' ''; }

# גולש מחובר = יש עוגיית התחברות של האתר
map $http_cookie $ogen_authed { default 0; "~*sb-ogenplay-auth-token" 1; }
# מטמון קצר רק לאורחים ורק לעמוד מלא (לא לבקשת RSC של ניווט פנימי)
map "$ogen_authed$http_rsc" $ogen_nocache { default 1; "0" 0; }

upstream ogen_app {
    server 127.0.0.1:3000 max_fails=2 fail_timeout=3s;
    server 127.0.0.1:3001 max_fails=2 fail_timeout=3s;
    server 127.0.0.1:3002 max_fails=2 fail_timeout=3s;
    keepalive 32;
}
