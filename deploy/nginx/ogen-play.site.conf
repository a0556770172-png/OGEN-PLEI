# תיעוד בלבד - ההעתק החי: /etc/nginx/sites-enabled/ogen-play (נתיבי תעודות הוסתרו)
server {
    server_name ogenplay.com www.ogenplay.com 84.13.81.124;
    client_max_body_size 20m;
    # --- הגדרות proxy משותפות: חיבור חי, בלי דחיסה מצד Node (nginx דוחס), ניסיון חוזר אם האפליקציה בהפעלה מחדש ---
    # קבצים סטטיים של Next - ישירות מהדיסק (בלי לגעת ב-Node), מטמון שנה (שמות הקבצים כוללים hash)
    location /_next/static/ {
        alias /opt/ogen-play/.next/static/;
        expires 1y;
        access_log off;
        log_not_found off;
        error_page 404 = @ogen_node;
    }

    location @ogen_node {
        proxy_pass http://ogen_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ogen_conn_upgrade;
        proxy_set_header Accept-Encoding "";
    }

    # אופטימייזר התמונות של Next - התוצאה (לפי גודל ופורמט) נשמרת ב-nginx ל-30 יום
    location /_next/image {
        proxy_pass http://ogen_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection $ogen_conn_upgrade;
        proxy_set_header Accept-Encoding "";
        proxy_cache ogen;
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
    }

    # תמונות/צילומי מסך/סרטונים מ-R2 - שומרים בקשות רגילות; בקשות טווח (Range) של סרטונים עוברות ישר
    location /api/cdn/ {
        proxy_pass http://ogen_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection $ogen_conn_upgrade;
        proxy_set_header Accept-Encoding "";
        proxy_cache ogen;
        proxy_cache_valid 200 7d;
        proxy_cache_lock on;
        proxy_cache_bypass $http_range;
        proxy_no_cache $http_range;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
    }

    # עמודי תוכן ציבוריים - לאורחים (בלי עוגיית התחברות) נשמרים 15 שניות. בקשה אחת בונה את העמוד וכל השאר
    # מקבלים אותו מיד; אם האפליקציה בהפעלה מחדש/נופלת - מוגש העותק האחרון במקום 502.
    location ~ ^/(|users|forum|about|site-reviews|community|site-rules|terms|privacy|advertise)$ {
        proxy_pass http://ogen_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection $ogen_conn_upgrade;
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
        proxy_cache ogen_html;
        proxy_cache_key "$scheme$host$request_uri|$cookie_ogen_lang";
        proxy_cache_valid 200 15s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 8s;
        proxy_cache_bypass $ogen_nocache;
        proxy_no_cache $ogen_nocache;
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
    }

    # שאר כרטיסי עמוד הבית - זהה לכל הגולשים, נשמר 15 שניות (כבר דחוס מ-Node)
    location = /api/apps/rest {
        proxy_pass http://ogen_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection $ogen_conn_upgrade;
        proxy_cache ogen_html;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_cache_valid 200 15s;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
    }

    location / {
        proxy_pass http://ogen_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ogen_conn_upgrade;
        proxy_set_header Accept-Encoding "";
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
        proxy_next_upstream error timeout http_502 http_503;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    large_client_header_buffers 4 32k;
    ssl_certificate /etc/letsencrypt/live/DOMAIN/FILE.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/FILE.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.ogenplay.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = ogenplay.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name ogenplay.com www.ogenplay.com 84.13.81.124;
    return 404; # managed by Certbot




}