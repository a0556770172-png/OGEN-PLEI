# הגנת DDoS/הצפה - רמת nginx (L7). הסכומים גנרליים מאוד בכוונה כדי שאף משתמש אמיתי
# לא ייתקל בחסימה - נמדדה תעבורה אמיתית של כ-1-1.5 בקשות/שנייה בשיא, ו-854 IP ייחודיים/יום.
# כל הסכומים כאן גבוהים בהרבה מכל דפוס גלישה אנושי אפשרי, ומיועדים לחסום רק הצפה
# אוטומטית ממקור בודד. nodelay = בלי שום עיכוב מלאכותי בתוך המכסה - חסימה (429) רק
# כשחורגים ממש, בלי להאט אף בקשה לגיטימית.

limit_req_zone $ogen_limit_key zone=ogen_general_v2:10m rate=15r/s;
limit_req_zone $ogen_limit_key zone=ogen_auth_v2:10m rate=10r/m;
limit_req_zone $ogen_limit_key zone=ogen_botchat_v2:10m rate=20r/m;
limit_req_zone $ogen_limit_key zone=ogen_api_general_v2:10m rate=30r/s;

limit_conn_zone $ogen_limit_key zone=ogen_addr_v2:10m;

limit_req_status 429;
limit_conn_status 429;

client_header_timeout 10s;
client_body_timeout 15s;
send_timeout 15s;
limit_req_zone $ogen_limit_key zone=ogen_media_v2:10m rate=60r/s;
