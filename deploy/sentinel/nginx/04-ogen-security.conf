# ===== שכבת אבטחה של nginx לאתר עוגן פליי (נוסף 13.11.2026) =====
# עיקרון: הכול כאן הוא חיפוש בטבלאות/מפות בזיכרון (מיקרו-שניות), בלי שום קריאה חיצונית ובלי תהליך נוסף
# בנתיב הבקשה - כדי שלא תהיה פגיעה במהירות האתר. הזיהוי החכם והחסימות החכמות רצים בנפרד (ogen-sentinel).

# ---------- 1. לוג JSON לזיהוי (נכתב בחבילות, אין כתיבה לדיסק לכל בקשה) ----------
log_format ogen_json escape=json
  '{"t":"$time_iso8601","ip":"$remote_addr","m":"$request_method","h":"$host","u":"$request_uri",'
  '"s":$status,"b":$body_bytes_sent,"rt":$request_time,"urt":"$upstream_response_time",'
  '"ua":"$http_user_agent","ref":"$http_referer","org":"$http_origin","ck":"$ogen_authed",'
  '"cs":"$upstream_cache_status","wf":"$ogen_waf_uri","ba":"$ogen_bad_ua","rl":$request_length,"pr":"$server_protocol"}';
access_log /var/log/nginx/ogen_json.log ogen_json buffer=32k flush=2s;

# ---------- 2. סיווג בקשות חשודות לפי הכתובת (URI + query) ----------
# scan   = סריקת תשתית/קבצים רגישים (תשובה: ניתוק מיידי בלי תשובה, 444)
# exploit/sqli/xss/cmdi = ניסיון הזרקה/חדירה מוכר (תשובה: 403)
# ssrf   = כתובות פנימיות בפרמטרים - רק מתועד (יש לגיטימיות אפשרית), ה-sentinel מחליט
map $request_uri $ogen_waf_uri {
    default "";
    "~*(?:^|/)\.(?:env|git|svn|hg|DS_Store|htaccess|htpasswd|aws|ssh|bash_history|npmrc|docker)(?:$|[/?])" "scan";
    "~*/(?:wp-admin|wp-login|wp-content|wp-includes|xmlrpc\.php|wlwmanifest|phpmyadmin|pma/|adminer|cgi-bin|boaform|HNAP1|actuator|solr/|jenkins|manager/html|vendor/phpunit|_ignition|server-status|console/|\.ssh|config\.json|backup\.(?:zip|sql|tar))" "scan";
    "~*\.(?:php\d?|asp|aspx|jsp|jspx|cgi|sql|bak|swp|ini|env|yml|yaml|conf|log)(?:$|\?|/)" "scan";
    "~*(?:\$\{jndi:|%24%7bjndi|\.\./\.\./|%2e%2e%2f|%2e%2e/|\.\.%2f|%252e%252e|/etc/passwd|/etc/shadow|/proc/self|php://|expect://|zip://|phar://|data://text|file://|gopher://|ldap://|dict://)" "exploit";
    "~*(?:union(?:%20|\+|\s|/\*.*?\*/)+(?:all(?:%20|\+|\s)+)?select|information_schema|sleep\((?:%20|\+)*\d|benchmark\((?:%20|\+)*\d|waitfor(?:%20|\+)+delay|extractvalue\(|updatexml\(|(?:'|%27)(?:%20|\+)*(?:or|and)(?:%20|\+)+(?:'|%27|\d)|(?:'|%27)(?:%20|\+)*(?:--|%2d%2d|#|%23)|pg_sleep\(|load_file\()" "sqli";
    "~*(?:<script|%3cscript|javascript:|vbscript:|onerror(?:%20|\+)*=|onload(?:%20|\+)*=|onmouseover(?:%20|\+)*=|<svg|%3csvg|<iframe|%3ciframe|<img(?:%20|\+|/)|%3cimg|document\.cookie|alert(?:%28|\()|%3cbody)" "xss";
    "~*(?:;|%3b|\||%7c|`|%60|\$\(|%24%28)(?:%20|\+|\s)*(?:wget|curl|nc|ncat|bash|sh|cat|id|whoami|uname|ls|ping|powershell|cmd)(?:%20|\+|\s|;|$)" "cmdi";
    "~*(?:169\.254\.169\.254|metadata\.google\.internal|(?:^|[=/])localhost[:/]|127\.0\.0\.1|0\.0\.0\.0|\[::1\]|%5b::1%5d)" "ssrf";
}

# סורקי פריצות וכלי תקיפה מוכרים (לפי User-Agent). לא חוסמים כלי רגיל (curl, python) - רק שמות כלי תקיפה.
map $http_user_agent $ogen_bad_ua {
    default 0;
    "~*(?:sqlmap|nikto|nmap|masscan|zgrab|dirbuster|gobuster|wpscan|nuclei|havij|acunetix|netsparker|w3af|fimap|hydra|metasploit|openvas|burpsuite|zmeu|jaeles|feroxbuster|ffuf|dirb/|skipfish|arachni|vega/|webshag|joomscan|commix|xsstrike|dalfox)" 1;
}

# כותרת שמשמשת לעקיפת middleware ב-Next.js (CVE-2025-29927 ומשפחתה) - לקוח אמיתי לעולם לא שולח אותה
map $http_x_middleware_subrequest $ogen_bad_hdr {
    default 1;
    "" 0;
}

# פעולה משנה מצב (POST/PUT/PATCH/DELETE) ל-/api/ שמגיעה עם כותרת Origin מדומיין זר = CSRF (דפדפן שולח Origin בכל בקשה חוצת-אתר).
# מותרים: האתר עצמו, תוספי דפדפן (תוסף צוות הפיקוח), אפליקציות מובנות. בקשות בלי Origin (אפליקציית אנדרואיד, curl, שרת-לשרת) לא נחסמות.
# כלל הרשומות הראשון שמתאים קובע - לכן ההיתרים קודם.
map "$request_method|$http_origin|$uri" $ogen_csrf {
    default 0;
    "~^(?:POST|PUT|PATCH|DELETE)\|https://(?:www\.|api\.)?ogenplay\.com\|" 0;
    "~^(?:POST|PUT|PATCH|DELETE)\|(?:chrome|moz|safari-web)-extension://[^|]*\|" 0;
    "~^(?:POST|PUT|PATCH|DELETE)\|(?:capacitor|ionic|file)://[^|]*\|" 0;
    "~^(?:POST|PUT|PATCH|DELETE)\|[^|]+\|/api/" 1;
}

# האתר לא משתמש ב-Server Actions בכלל (אין "use server" בקוד). כותרת Next-Action היא וקטור ידוע לתקיפות
# דה-סריאליזציה / DoS של React Server Components (CVE-ים בגרסאות 14.x-15.x) - לקוח אמיתי לעולם לא שולח אותה.
map $http_next_action $ogen_bad_action {
    default 1;
    "" 0;
}

# שער ה-Supabase (Kong) חושף גם את לוח הבקרה Studio, אנליטיקה ו-pg-meta, שמוגנים רק בסיסמת Basic. דרך הפרוקסי
# /api/sb ודרך api.ogenplay.com הם נגישים מהאינטרנט. האתר צריך רק את שירותי ה-API עצמם - כל השאר ננעל (404).
map "$host|$uri" $ogen_sb_forbidden {
    default 0;
    "~^(?:www\.)?ogenplay\.com\|/api/sb/(?:auth|rest|realtime|storage|functions|graphql)/v1(?:/|$)" 0;
    "~^(?:www\.)?ogenplay\.com\|/api/sb(?:/|$)" 1;
    "~^api\.ogenplay\.com\|/(?:auth|rest|realtime|storage|functions|graphql)/v1(?:/|$)" 0;
    "~^api\.ogenplay\.com\|" 1;
}

# ---------- 3. הגבלת ניחוש סיסמאות / איפוס סיסמה / הרשמות המוניות ----------
# המפתח ריק (=אין הגבלה) לכל בקשה רגילה, וה-IP רק בבקשות רגישות. רענון טוקן (grant_type=refresh_token) לא מוגבל.
map "$request_method|$uri|$arg_grant_type" $ogen_authkey {
    default "";
    "~^POST\|/api/sb/auth/v1/token\|password$"                                       $ogen_limit_key;
    "~^POST\|/api/sb/auth/v1/(?:signup|recover|otp|magiclink|resend|verify)\|"       $ogen_limit_key;
    "~^POST\|/api/auth/(?:reset-request|reset-verify|reset-question|reset-escalate|reset-assistant|email-exists)\|" $ogen_limit_key;
}
limit_req_zone $ogen_authkey zone=ogen_authsb_v2:10m rate=12r/m;

# ---------- 4. עמידות להתקפות איטיות (Slowloris וכו') והצפת חיבורים ----------
reset_timedout_connection on;
keepalive_timeout 30s;
keepalive_requests 1000;
http2_max_concurrent_streams 64;
max_ranges 8;
