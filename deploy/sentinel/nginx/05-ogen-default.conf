# כל בקשה שלא מיועדת לדומיינים שלנו (סריקות לפי כתובת IP, Host מזויף) - ניתוק מיידי בלי תעודה ובלי תשובה.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}
