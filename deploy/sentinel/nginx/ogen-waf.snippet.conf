# נכלל בתוך כל server של HTTPS (ogenplay.com ו-api.ogenplay.com). רץ לפני בחירת ה-location.
if ($ogen_waf_uri = "scan")  { return 444; }
if ($ogen_waf_uri ~ "^(?:exploit|sqli|xss|cmdi)$") { return 403; }
if ($ogen_bad_ua)  { return 444; }
if ($ogen_bad_hdr) { return 400; }
if ($ogen_csrf)    { return 403; }
if ($ogen_bad_action) { return 403; }
if ($ogen_sb_forbidden) { return 404; }
